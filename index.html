<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b12"><meta name="description" content="Nadj Distribution — manage your music releases.">
  <title>Nadj Distribution</title><link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" aria-label="Nadj Distribution home"><span class="brand-mark">N</span><span>NADJ<span class="brand-light"> DISTRIBUTION</span></span></a>
    <div class="workspace-label">WORKSPACE</div>
    <nav class="nav">
      <button class="nav-link active" data-view="dashboard"><span>▦</span> Overview</button>
      <button class="nav-link" data-view="releases"><span>♫</span> My releases</button>
      <button class="nav-link" data-view="upload"><span>＋</span> Create release</button>
      <button class="nav-link" data-view="analytics"><span>▥</span> Analytics</button>
    </nav>
    <div class="sidebar-bottom"><div class="help-card"><div class="help-icon">✦</div><strong>Ready to release?</strong><p>Prepare your next track and get it ready for distribution.</p><button class="text-button" data-go="upload">Start a release →</button></div><div class="profile"><div class="avatar">N</div><div><strong>Artist account</strong><small>Independent artist</small></div><span class="online-dot"></span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button><div class="breadcrumb">Workspace <span>/</span> <b id="pageName">Overview</b></div><div class="top-actions"><span class="status-pill"><i></i> Workspace ready</span><div class="avatar small">N</div></div></header>
    <section class="content" id="viewRoot"></section>
    <footer>© <span id="year"></span> Nadj Distribution <span>•</span> Independent music, worldwide ambition.</footer>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="releaseDialog" class="release-dialog"><div id="dialogContent"></div><button class="btn secondary full" id="closeDialog">Close</button></dialog>
<script src="app.js"></script>
</body></html>
